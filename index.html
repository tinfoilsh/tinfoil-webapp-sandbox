<h1>Tinfoil webapp sandbox</h1>
<p>This origin runs untrusted, model-generated code previews for <a href="https://chat.tinfoil.sh">Tinfoil Chat</a> inside sandboxed iframes. It holds no user data and is deliberately <strong>not</strong> WEBCAT-verified.</p>
<p>Source: <a href="https://github.com/tinfoilsh/tinfoil-webapp-sandbox">github.com/tinfoilsh/tinfoil-webapp-sandbox</a></p>
